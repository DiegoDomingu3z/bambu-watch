[project]
name = "bambu-watch"
version = "0.1.0"
description = "Advisory AI print-failure monitor for the Bambu Lab P1S"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.5.0",
    "paho-mqtt>=2.1.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.15.0",
    "pillow>=12.0.0",
    "httpx2>=2.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Explicit rather than relying on ruff's default, which widens between
# versions. BLE001/S110 are deliberately not selected: this is a monitoring
# daemon whose design requires that no network edge can kill the loop, so the
# broad excepts in the camera, MQTT, vision, notifier and monitor layers are
# intentional and documented in the design spec.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "ISC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# dict(...) with keyword args reads better than a literal in the settings
# helpers that every test module uses.
"tests/**" = ["C408"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
